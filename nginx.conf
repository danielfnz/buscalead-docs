# docs.buscalead.com: site estático. As rotas sem .html (/docs, /contratacao/sucesso) resolvem por try_files.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    # Os headers ficam no nível do server: `expires` não conta como add_header, então as locations herdam.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Páginas: cache curto (preço e o interruptor SALES_OPEN mudam a cada deploy).
    location / {
        try_files $uri $uri.html $uri/ =404;
        expires 5m;
    }

    # Imagens e ícones: cache longo.
    location /assets/ {
        try_files $uri =404;
        expires 30d;
    }

    # site.js e site.css não têm hash no nome e o SALES_OPEN mora no site.js: revalidam sempre (ETag, 304).
    location ~ ^/assets/.+\.(js|css)$ {
        try_files $uri =404;
        expires -1;
    }
}
